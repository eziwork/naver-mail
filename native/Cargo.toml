[package]
name = "naver-mail-bridge"
version = "0.2.0"
edition = "2024"
license = "MIT"

[dependencies]
rmcp = { version = "=3.2.0", default-features = false, features = ["server", "client", "transport-io"] }
tokio = { version = "1", features = ["rt", "io-std", "io-util", "net", "time", "sync", "macros"] }
serde_json = "1"
sha2 = "0.10"
hmac = "0.12"
rand = "0.8"
fs2 = "0.4"

[target.'cfg(windows)'.dependencies]
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Security", "Win32_Security_Authorization"] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
strip = true
panic = "abort"
