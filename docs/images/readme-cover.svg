    <rect x="728" y="361" width="50" height="8" rx="4" fill="#d5e2d9"/><rect x="815" y="361" width="94" height="8" rx="4" fill="#d5e2d9"/><rect x="966" y="361" width="112" height="8" rx="4" fill="#d5e2d9"/>
    <text x="1133" y="480" text-anchor="end" fill="#b1d3c0" font-size="15">Eziwork 제작 · NAVER 비공식 도구</text>
