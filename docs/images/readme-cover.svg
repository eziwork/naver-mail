<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="560" viewBox="0 0 1200 560" role="img" aria-labelledby="title desc">
  <title id="title">네이버 메일, 이제 대화로.</title>
  <desc id="desc">Eziwork의 비공식 네이버 메일 플러그인. 찾기, 정리하기, 확인 후 보내기를 대화로 요청하는 사용 예시입니다.</desc>
  <defs>
    <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#092c24"/><stop offset="1" stop-color="#124c38"/></linearGradient>
    <pattern id="grid" width="40" height="40" patternUnits="userSpaceOnUse"><path d="M40 0H0V40" fill="none" stroke="#ffffff" stroke-opacity=".035"/></pattern>
  </defs>
  <rect width="1200" height="560" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="560" rx="28" fill="url(#grid)"/>
  <circle cx="1090" cy="540" r="260" fill="#03c75a" opacity=".07"/>
